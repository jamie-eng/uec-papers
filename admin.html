
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考卷收集站 - 管理員後台</title>
  <style>
    :root {
      --bg-color: #f2f3f5;
      --card-bg: #ffffff;
      --text-color: #111111;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --border-color: #e2e2e2;
      --danger-btn: #d32f2f;
      --header-purple: #f0ebf8;
      --header-text: #4a3b68;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px;
    }

    .admin-container { width: 100%; max-width: 480px; }

    .card {
      background-color: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow);
      padding: 24px; margin-top: 20px; display: flex; flex-direction: column; gap: 16px;
    }

    h2 { font-size: 20px; text-align: center; margin-bottom: 8px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 14px; font-weight: 600; }
    input {
      padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;
    }

    button {
      padding: 12px; border-radius: 8px; border: none; background-color: #4a3b68; color: white;
      font-weight: bold; font-size: 15px; cursor: pointer;
    }

    .btn-delete {
      background-color: var(--danger-btn); padding: 6px 10px; font-size: 12px; border-radius: 6px;
    }

    .table-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
    th { background-color: var(--header-purple); color: var(--header-text); padding: 10px 4px; font-weight: 700; }
    td { padding: 10px 4px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }

    .error-msg { color: var(--danger-btn); font-size: 13px; text-align: center; display: none; }
    .year-tag { font-size: 10px; background: #eee; padding: 2px 4px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- 登录验证界面 -->
    <div id="login-card" class="card">
      <h2>🔒 管理員身份驗證</h2>
      <div class="form-group">
        <label>請輸入 Admin Password</label>
        <input type="password" id="adminPassword" placeholder="輸入管理密碼..." />
      </div>
      <button onclick="loginAdmin()">登入後台</button>
      <div id="login-error" class="error-msg">密碼錯誤，請重試！</div>
    </div>

    <!-- 管理员操作面板 -->
    <div id="panel-card" class="card" style="display: none;">
      <h2>👑 試卷數據管理后台</h2>
      <button onclick="logoutAdmin()" style="background-color: #777; padding: 8px; font-size: 13px;">登出</button>
      
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>年份/科目</th>
              <th>學校/上載者</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="admin-papers-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 默认管理员密码 (你可以修改成你喜欢的密码)
    const ADMIN_PASS = "admin123";

    function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('panel-card').style.display = 'flex';
        loadPapersForAdmin();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function logoutAdmin() {
      document.getElementById('adminPassword').value = '';
      document.getElementById('login-card').style.display = 'flex';
      document.getElementById('panel-card').style.display = 'none';
    }

    function getStoredPapers() {
      try {
        const data = localStorage.getItem('uec_papers_data');
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function loadPapersForAdmin() {
      const papers = getStoredPapers();
      const tbody = document.getElementById('admin-papers-list');
      tbody.innerHTML = '';

      if (papers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="padding:16px;">目前沒有任何試卷數據</td></tr>';
        return;
      }

      papers.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="year-tag">${escapeHtml(item.year)}</span><br><b>${escapeHtml(item.subject)}</b></td>
          <td>${escapeHtml(item.school)}<br><small style="opacity:0.7">${escapeHtml(item.uploader)}</small></td>
          <td><button class="btn-delete" onclick="deletePaper(${item.id})">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deletePaper(id) {
      if (confirm('確定要刪除這份試卷嗎？')) {
        let papers = getStoredPapers();
        papers = papers.filter(p => p.id !== id);
        try {
          localStorage.setItem('uec_papers_data', JSON.stringify(papers));
        } catch(e) {}
        loadPapersForAdmin();
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
