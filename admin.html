<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考卷收集站 - 管理員後台</title>
  <style>
    :root {
      --bg-color: #f2f3f5;
      --card-bg: #ffffff;
      --text-color: #111111;
      --shadow: 0 4px 16px rgba(0,0,0,0.08);
      --border-color: #e2e2e2;
      --danger-btn: #d32f2f;
      --header-purple: #f0ebf8;
      --header-text: #4a3b68;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .admin-container { width: 100%; max-width: 480px; }
    .card { background-color: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); padding: 24px; margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
    h2 { font-size: 20px; text-align: center; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    input { padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
    button { padding: 12px; border-radius: 8px; border: none; background-color: #4a3b68; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn-delete { background-color: var(--danger-btn); padding: 6px 10px; font-size: 12px; border-radius: 6px; }
    .table-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
    th { background-color: var(--header-purple); color: var(--header-text); padding: 10px 4px; font-weight: 700; }
    td { padding: 10px 4px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .error-msg { color: var(--danger-btn); font-size: 13px; text-align: center; display: none; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div id="login-card" class="card">
      <h2>🔒 管理員身份驗證</h2>
      <div class="form-group">
        <input type="password" id="adminPassword" placeholder="輸入管理密碼..." />
      </div>
      <button onclick="loginAdmin()">登入後台</button>
      <div id="login-error" class="error-msg">密碼錯誤！</div>
    </div>

    <div id="panel-card" class="card" style="display: none;">
      <h2>👑 Firebase 試卷數據管理中心</h2>
      <button onclick="logoutAdmin()" style="background-color: #777; padding: 6px; font-size: 12px;">登出</button>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>年份/科目</th>
              <th>學校/上載者</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="admin-papers-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const DB_BASE_URL = "https://uec-papers-default-rtdb.firebaseio.com/papers";
    const ADMIN_PASS = "admin123";

    function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('panel-card').style.display = 'flex';
        loadPapers();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function logoutAdmin() {
      document.getElementById('login-card').style.display = 'flex';
      document.getElementById('panel-card').style.display = 'none';
    }

    async function loadPapers() {
      const tbody = document.getElementById('admin-papers-list');
      tbody.innerHTML = '<tr><td colspan="3" style="padding:16px;">載入 Firebase 數據中...</td></tr>';

      try {
        const response = await fetch(`${DB_BASE_URL}.json`);
        const data = await response.json();
        
        tbody.innerHTML = '';
        if (!data) {
          tbody.innerHTML = '<tr><td colspan="3" style="padding:16px;">目前 Firebase 沒有任何試卷數據</td></tr>';
          return;
        }

        Object.keys(data).forEach(id => {
          const item = data[id];
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>[${escapeHtml(item.year)}]<br><b>${escapeHtml(item.subject)}</b></td>
            <td>${escapeHtml(item.school)}<br><small style="opacity:0.7">${escapeHtml(item.uploader)}</small></td>
            <td><button class="btn-delete" onclick="deletePaper('${id}')">刪除</button></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="3" style="padding:16px; color:red;">載入失敗</td></tr>';
      }
    }

    async function deletePaper(id) {
      if (confirm('確定要從 Firebase 雲端刪除這份試卷嗎？')) {
        try {
          const response = await fetch(`${DB_BASE_URL}/${id}.json`, {
            method: 'DELETE'
          });
          if (response.ok) {
            loadPapers();
          } else {
            alert('刪除失敗！');
          }
        } catch (err) {
          alert('刪除失敗！');
        }
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
