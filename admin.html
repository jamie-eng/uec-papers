<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考卷收集站 - 管理員後台</title>
  <style>
    :root {
      --bg-color: #f2f3f5;
      --card-bg: #ffffff;
      --text-color: #111111;
      --shadow: 0 4px 16px rgba(0,0,0,0.08);
      --border-color: #e2e2e2;
      --danger-btn: #d32f2f;
      --header-purple: #f0ebf8;
      --header-text: #4a3b68;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .admin-container { width: 100%; max-width: 680px; }
    .card { background-color: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow); padding: 24px; margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
    h2 { font-size: 20px; text-align: center; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    input[type="password"], select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; }
    button { padding: 8px 14px; border-radius: 8px; border: none; background-color: #4a3b68; color: white; font-weight: bold; font-size: 13px; cursor: pointer; }
    .btn-delete { background-color: var(--danger-btn); padding: 6px 10px; font-size: 12px; border-radius: 6px; }
    .btn-action { background-color: #4a3b68; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
    .table-wrapper { border-radius: 12px; overflow-x: auto; border: 1px solid var(--border-color); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
    th { background-color: var(--header-purple); color: var(--header-text); padding: 10px 6px; font-weight: 700; }
    td { padding: 10px 6px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .error-msg { color: var(--danger-btn); font-size: 13px; text-align: center; display: none; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background-color: #f9f9fb; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
    .filter-group { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; }
    .link-btn { text-decoration: none; color: #1976d2; font-weight: bold; font-size: 12px; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div id="login-card" class="card">
      <h2>🔒 管理員身份驗證</h2>
      <div class="form-group">
        <input type="password" id="adminPassword" placeholder="輸入管理密碼..." />
      </div>
      <button onclick="loginAdmin()">登入後台</button>
      <div id="login-error" class="error-msg">密碼錯誤！</div>
    </div>

    <div id="panel-card" class="card" style="display: none;">
      <h2>👑 Firebase 試卷數據管理中心</h2>
      
      <div class="toolbar">
        <div class="filter-group">
          <label for="yearFilter">📅 年份分類：</label>
          <select id="yearFilter" onchange="renderTable()">
            <option value="all">全部年份 (All)</option>
            <option value="2026">2026 年考卷</option>
            <option value="before2026">2026 年以前 (2025 & 更早)</option>
          </select>
        </div>

        <div>
          <button onclick="deleteSelected()" class="btn-delete">刪除已選取</button>
          <button onclick="loadPapers()" class="btn-action">重新整理</button>
          <button onclick="logoutAdmin()" style="background-color: #777; margin-left: 4px;">登出</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
              <th>年份/科目</th>
              <th>學校/上載者</th>
              <th>連結</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="admin-papers-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const DB_BASE_URL = "https://uec-papers-default-rtdb.firebaseio.com/papers";
    const ADMIN_PASS = "Yitwan6988";
    let paperList = [];

    function loginAdmin() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === ADMIN_PASS) {
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('panel-card').style.display = 'flex';
        loadPapers();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    }

    function logoutAdmin() {
      document.getElementById('login-card').style.display = 'flex';
      document.getElementById('panel-card').style.display = 'none';
    }

    async function loadPapers() {
      const tbody = document.getElementById('admin-papers-list');
      tbody.innerHTML = '<tr><td colspan="5" style="padding:16px;">載入 Firebase 數據中...</td></tr>';
      document.getElementById('selectAll').checked = false;

      try {
        const response = await fetch(`${DB_BASE_URL}.json`);
        const data = await response.json();
        
        tbody.innerHTML = '';
        if (!data) {
          tbody.innerHTML = '<tr><td colspan="5" style="padding:16px;">目前 Firebase 沒有任何試卷數據</td></tr>';
          paperList = [];
          return;
        }

        paperList = Object.keys(data).map(id => ({
          id: id,
          ...data[id]
        }));

        renderTable();
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" style="padding:16px; color:red;">載入失敗</td></tr>';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('admin-papers-list');
      const filterValue = document.getElementById('yearFilter').value;
      tbody.innerHTML = '';

      // 根據下拉選單篩選年份 (2026 vs 2026以前)
      let filteredList = paperList.filter(item => {
        const paperYear = parseInt(item.year, 10);
        if (filterValue === '2026') {
          return paperYear === 2026 || item.year === '2026';
        } else if (filterValue === 'before2026') {
          return paperYear < 2026 || (!isNaN(paperYear) && paperYear < 2026);
        }
        return true; // 'all'
      });

      if (filteredList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="padding:16px; opacity: 0.7;">該分類下沒有任何試卷數據</td></tr>';
        return;
      }

      filteredList.forEach(item => {
        const tr = document.createElement('tr');
        
        const fileUrl = item.url || item.fileUrl || item.link || '';
        const linkHtml = fileUrl 
          ? `<a href="${escapeHtml(fileUrl)}" target="_blank" class="link-btn">查看/下載</a>`
          : '<span style="opacity:0.5">-</span>';

        tr.innerHTML = `
          <td><input type="checkbox" class="paper-select" value="${item.id}"></td>
          <td>[${escapeHtml(item.year)}]<br><b>${escapeHtml(item.subject)}</b></td>
          <td>${escapeHtml(item.school)}<br><small style="opacity:0.7">${escapeHtml(item.uploader)}</small></td>
          <td>${linkHtml}</td>
          <td><button class="btn-delete" onclick="deletePaper('${item.id}')">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function deletePaper(id) {
      if (confirm('確定要從 Firebase 雲端刪除這份試卷嗎？')) {
        try {
          const response = await fetch(`${DB_BASE_URL}/${id}.json`, { method: 'DELETE' });
          if (response.ok) {
            loadPapers();
          } else {
            alert('刪除失敗！');
          }
        } catch (err) {
          alert('刪除失敗！');
        }
      }
    }

    async function deleteSelected() {
      const checkboxes = document.querySelectorAll('.paper-select:checked');
      if (checkboxes.length === 0) {
        alert('請先勾選要刪除的試卷！');
        return;
      }

      if (confirm(`確定要刪除選取的 ${checkboxes.length} 份試卷嗎？`)) {
        try {
          const promises = Array.from(checkboxes).map(cb => 
            fetch(`${DB_BASE_URL}/${cb.value}.json`, { method: 'DELETE' })
          );
          await Promise.all(promises);
          loadPapers();
        } catch (err) {
          alert('批量刪除部分失敗，請重新整理！');
          loadPapers();
        }
      }
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.paper-select');
      checkboxes.forEach(cb => cb.checked = master.checked);
    }

    function escapeHtml(str) {
      return (str || '').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
