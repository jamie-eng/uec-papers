<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>統考預試試卷收集站</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg-color: #f2f3f5;
      --card-bg: #ffffff;
      --text-color: #111111;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --header-purple: #f0ebf8;
      --header-text: #4a3b68;
      --row-even: #ffffff;
      --row-odd: #fffdf5;
      --primary-btn: #4a3b68;
      --border-color: #e2e2e2;
      --success-btn: #2e7d32;
      --danger-btn: #d32f2f;
      --edit-btn: #1976d2;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      --header-purple: #2d243a;
      --header-text: #d8cbeb;
      --row-even: #1e1e1e;
      --row-odd: #26241e;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding-bottom: 40px; transition: background-color 0.3s, color 0.3s;
    }

    header {
      width: 100%; max-width: 480px; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background-color: var(--bg-color); z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 20px; font-weight: 700; line-height: 1.2; }
    .header-right { display: flex; align-items: center; gap: 6px; }

    .icon-btn {
      background: none; border: none; cursor: pointer; color: var(--text-color);
      display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 50%;
    }

    .login-btn {
      background-color: var(--primary-btn); color: white; border: none; padding: 6px 10px;
      border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
    }

    .admin-nav-btn {
      background-color: #333; color: white; border: none; padding: 6px 8px;
      border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
    }

    main { width: 100%; max-width: 480px; padding: 12px 20px; display: flex; flex-direction: column; gap: 16px; }

    .card {
      background-color: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow);
      padding: 30px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.2s;
    }

    .card:active { transform: scale(0.98); }
    .card-icon { width: 40px; height: 40px; margin-bottom: 12px; }
    .card-title { font-size: 18px; font-weight: 700; text-align: center; }

    .view-section {
      display: none; background-color: var(--card-bg); border-radius: 16px;
      padding: 20px; box-shadow: var(--shadow); margin-top: 10px;
    }

    .back-btn {
      background: none; border: none; color: var(--text-color); font-size: 14px;
      font-weight: 600; cursor: pointer; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 4px;
    }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }

    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 14px; font-weight: 600; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border-color);
      background-color: var(--card-bg); color: var(--text-color); border-radius: 8px; font-size: 14px; outline: none;
    }

    .file-hint { font-size: 11px; opacity: 0.6; margin-top: -2px; }

    .btn-submit {
      width: 100%; background-color: var(--primary-btn); color: white; border: none;
      padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn-submit.success { background-color: var(--success-btn); }

    .table-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
    th { background-color: var(--header-purple); color: var(--header-text); padding: 12px 6px; font-weight: 700; border-bottom: 1px solid var(--border-color); }
    td { padding: 10px 6px; vertical-align: middle; border-bottom: 1px solid var(--border-color); font-weight: 600; line-height: 1.3; }
    tr:nth-child(even) td { background-color: var(--row-even); }
    tr:nth-child(odd) td { background-color: var(--row-odd); }
    
    .year-tag { font-size: 10px; background: #e0e0e0; color: #333; padding: 2px 5px; border-radius: 4px; margin-right: 4px; display: inline-block; }
    body.dark-mode .year-tag { background: #444; color: #fff; }
    
    .uploader-tag { font-size: 11px; opacity: 0.7; font-weight: normal; margin-top: 4px; }
    .download-btn { cursor: pointer; border: none; color: var(--header-text); font-size: 13px; font-weight: bold; background: var(--header-purple); padding: 6px 12px; border-radius: 6px; display: inline-block; }

    .or-divider { text-align: center; font-size: 12px; opacity: 0.5; margin: 6px 0; }
    .switch-mode-text { text-align: center; font-size: 12px; margin-top: 10px; color: var(--primary-btn); cursor: pointer; font-weight: bold; }

    /* Modals */
    .modal {
      display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85); flex-direction: column; align-items: center; justify-content: center; padding: 10px;
    }
    .modal-header {
      width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; color: white; padding: 10px 0;
    }
    .modal-close { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
    .modal-body {
      width: 100%; max-width: 600px; height: 80vh; background: #1a1a1a; border-radius: 12px; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center; position: relative; padding: 10px;
    }
    .modal-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .pdf-page-canvas { width: 100% !important; height: auto !important; margin-bottom: 10px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }

    /* Admin Panel Modal */
    .admin-modal-content {
      background: var(--card-bg); color: var(--text-color); width: 95%; max-width: 820px; height: 88vh;
      border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; box-shadow: var(--shadow);
    }
    .status-badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; display: inline-block; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d4edda; color: #155724; }
    
    .action-btns { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; align-items: center; }
    .btn-delete { background-color: var(--danger-btn); padding: 5px 7px; font-size: 11px; border-radius: 6px; color: white; border: none; cursor: pointer; }
    .btn-edit { background-color: var(--edit-btn); padding: 5px 7px; font-size: 11px; border-radius: 6px; color: white; border: none; cursor: pointer; }
    .btn-approve { background-color: var(--success-btn); padding: 5px 7px; font-size: 11px; border-radius: 6px; color: white; border: none; cursor: pointer; }
    .btn-view-admin { background-color: var(--header-purple); color: var(--header-text); padding: 5px 7px; font-size: 11px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }

    svg { stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1 class="header-title">統考預試試卷<br>收集站</h1>
    </div>
    <div class="header-right">
      <button class="admin-nav-btn" onclick="openAdminLogin()">管理員</button>
      <button class="login-btn" id="login-status-btn" onclick="openAuthView()">登入</button>
      <button class="icon-btn" id="theme-toggle">
        <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="23" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <main id="main-menu">
    <div class="card" id="btn-upload">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">上傳考卷</div>
    </div>
    <div class="card" id="btn-download-2026">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">下載考卷 (2026)</div>
    </div>
    <div class="card" id="btn-download-old">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">下載考卷 (2025 及之前)</div>
    </div>
  </main>

  <main id="auth-view" class="view-section">
    <button class="back-btn" onclick="showMenu()">← 返回主頁</button>
    <div class="section-title" id="auth-title">🔐 帳號登入</div>
    <form id="auth-form">
      <div class="form-group">
        <label>電子郵件 (Gmail)</label>
        <input type="email" id="authEmail" required placeholder="example@gmail.com" />
      </div>
      <div class="form-group">
        <label>密碼 (Password)</label>
        <input type="password" id="authPassword" required placeholder="至少 6 位密碼" />
      </div>
      <button type="submit" class="btn-submit" id="auth-submit-btn">立即登入</button>
      <div class="switch-mode-text" id="switch-auth-mode" onclick="toggleAuthMode()">還沒有帳號？點此免費註冊</div>
    </form>
  </main>

  <main id="upload-view" class="view-section">
    <button class="back-btn" onclick="showMenu()">← 返回主頁</button>
    <div class="section-title">↑ 上傳考卷</div>
    <form id="upload-form">
      <div class="form-group">
        <label>上載者姓名 (Name)</label>
        <input type="text" id="uploaderName" required placeholder="例如: 小明" />
      </div>
      <div class="form-group">
        <label>年份 (Year)</label>
        <input type="number" id="paperYear" required value="2026" />
      </div>
      <div class="form-group">
        <label>科目 (Subject)</label>
        <input type="text" id="subjectName" required placeholder="例如: 華文試卷 1" />
      </div>
      <div class="form-group">
        <label>學校 (School)</label>
        <input type="text" id="schoolName" required placeholder="例如: 巴生興華中學" />
      </div>
      
      <div class="form-group">
        <label>📁 選擇本地檔案 (PDF / 圖片)</label>
        <input type="file" id="paperFile" accept=".pdf,image/*" />
        <span class="file-hint">⚠️ 檔案大小上限：<b>100MB</b></span>
      </div>

      <div class="or-divider">── 或填寫網絡連結 ──</div>

      <div class="form-group">
        <label>考卷下載連結 (Google Drive / 云端)</label>
        <input type="url" id="downloadUrl" placeholder="https://drive.google.com/..." />
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">上傳送審 (需管理員審核)</button>
    </form>
  </main>

  <main id="download-view" class="view-section">
    <button class="back-btn" onclick="showMenu()">← 返回主頁</button>
    <div class="section-title" id="download-title">↓ 下載考卷</div>
    <div style="font-size: 12px; opacity: 0.8; text-align: center; margin-bottom: 12px;" id="unlock-status-banner"></div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>年份/科目</th>
            <th>學校</th>
            <th>檢視/下載</th>
          </tr>
        </thead>
        <tbody id="papers-list"></tbody>
      </table>
    </div>
  </main>

  <!-- File Viewer Modal -->
  <div id="viewer-modal" class="modal">
    <div class="modal-header">
      <span id="modal-title">考卷預覽</span>
      <button class="modal-close" onclick="closeViewer()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <!-- Admin Panel Modal -->
  <div id="admin-modal" class="modal">
    <div class="admin-modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>👑 管理員審核與排版後台</h2>
        <button class="modal-close" style="color:var(--text-color);" onclick="closeAdminModal()">&times;</button>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: #f9f9fb; padding: 10px; border-radius: 8px;">
        <div>
          <label style="font-size: 13px; font-weight: bold;">篩選狀態：</label>
          <select id="adminStatusFilter" onchange="renderAdminTable()" style="padding: 6px; border-radius: 6px;">
            <option value="pending" selected>待審核 (Pending)</option>
            <option value="approved">已通過</option>
            <option value="all">全部</option>
          </select>
        </div>
        <button onclick="fetchAdminPapers()" style="padding: 6px 12px; background:var(--primary-btn); color:white; border:none; border-radius:6px; cursor:pointer;">重新整理</button>
      </div>
      <div class="table-wrapper" style="flex-grow: 1;">
        <table>
          <thead>
            <tr>
              <th>狀態</th>
              <th>年份/科目</th>
              <th>學校/上載者</th>
              <th>檔案/連結</th>
              <th>管理操作 (排/改/批)</th>
            </tr>
          </thead>
          <tbody id="admin-papers-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDGYJiK6BNfl9h6d2eu32oKHjx1rdqXy9U",
      authDomain: "uec-papers-4c1a7.firebaseapp.com",
      databaseURL: "https://uec-papers-4c1a7-default-rtdb.firebaseio.com",
      projectId: "uec-papers-4c1a7",
      storageBucket: "uec-papers-4c1a7.firebasestorage.app",
      messagingSenderId: "374691570353",
      appId: "1:374691570353:web:75fe8c55160343b20af890",
      measurementId: "G-323MBR471Y"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }

    const DB_URL = "https://uec-papers-4c1a7-default-rtdb.firebaseio.com/papers.json";
    const ADMIN_PASS = "Yitwan6988";
    let currentCategory = '2026';
    let papersData = [];
    let adminPaperList = [];
    let currentUser = null;
    let isRegisterMode = false;

    firebase.auth().onAuthStateChanged((user) => {
      currentUser = user;
      const loginBtn = document.getElementById('login-status-btn');
      if (user) {
        loginBtn.innerText = "登出";
        loginBtn.style.background = "#d32f2f";
      } else {
        loginBtn.innerText = "登入";
        loginBtn.style.background = "var(--primary-btn)";
      }
    });

    function openAuthView() {
      if (currentUser) {
        if (confirm(`目前已登入：${currentUser.email}\n確定要登出帳號嗎？`)) {
          firebase.auth().signOut().then(() => { showMenu(); });
        }
        return;
      }
      mainMenu.style.display = 'none';
      uploadView.style.display = 'none';
      downloadView.style.display = 'none';
      document.getElementById('auth-view').style.display = 'block';
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('auth-title');
      const submitBtn = document.getElementById('auth-submit-btn');
      const switchText = document.getElementById('switch-auth-mode');

      if (isRegisterMode) {
        title.innerText = "📝 免費帳號註冊";
        submitBtn.innerText = "確認註冊";
        switchText.innerText = "已有帳號？點此直接登入";
      } else {
        title.innerText = "🔐 帳號登入";
        submitBtn.innerText = "立即登入";
        switchText.innerText = "還沒有帳號？點此免費註冊";
      }
    }

    document.getElementById('auth-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const submitBtn = document.getElementById('auth-submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerText = '處理中...';

      try {
        if (isRegisterMode) {
          await firebase.auth().createUserWithEmailAndPassword(email, password);
          alert("註冊成功並已自動登入！");
        } else {
          await firebase.auth().signInWithEmailAndPassword(email, password);
          alert("登入成功！");
        }
        document.getElementById('authEmail').value = '';
        document.getElementById('authPassword').value = '';
        showMenu();
      } catch (err) {
        alert("操作失敗: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = isRegisterMode ? "確認註冊" : "立即登入";
      }
    });

    document.getElementById('theme-toggle').onclick = () => document.body.classList.toggle('dark-mode');
    const mainMenu = document.getElementById('main-menu');
    const uploadView = document.getElementById('upload-view');
    const downloadView = document.getElementById('download-view');

    function showMenu() {
      mainMenu.style.display = 'flex';
      uploadView.style.display = 'none';
      downloadView.style.display = 'none';
      document.getElementById('auth-view').style.display = 'none';
    }

    document.getElementById('btn-upload').onclick = () => {
      if (!currentUser) {
        alert("請先登入帳號才能上傳考卷！");
        openAuthView();
        return;
      }
      mainMenu.style.display = 'none';
      uploadView.style.display = 'block';
    };

    document.getElementById('btn-download-2026').onclick = () => openDownloadPage('2026');
    document.getElementById('btn-download-old').onclick = () => openDownloadPage('old');

    async function openDownloadPage(category) {
      if (!currentUser) {
        if (confirm("您需要先登入帳號才能查看或下載考卷。是否前往登入？")) {
          openAuthView();
        }
        return;
      }
      mainMenu.style.display = 'none';
      downloadView.style.display = 'block';
      currentCategory = category;
      document.getElementById('download-title').innerText = category === '2026' ? '↓ 下載考卷 (2026)' : '↓ 下載考卷 (2025 及之前)';
      await fetchPapers();
    }

    async function fetchPapers() {
      const listContainer = document.getElementById('papers-list');
      listContainer.innerHTML = '<tr><td colspan="3" style="padding:20px;">資料載入中...</td></tr>';

      try {
        const response = await fetch(DB_URL);
        const data = await response.json();
        
        papersData = [];
        if (data) {
          papersData = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        }

        const userRefUrl = `https://uec-papers-4c1a7-default-rtdb.firebaseio.com/users/${currentUser.uid}.json`;
        const userRes = await fetch(userRefUrl);
        const userData = await userRes.json() || { uploadedCount: 0 };
        const uploadedCount = userData.uploadedCount || 0;

        const filtered = papersData.filter(p => {
          if (p.approved !== true) return false;
          const y = parseInt(p.year);
          return currentCategory === '2026' ? y === 2026 : (y <= 2025 || isNaN(y));
        });

        const banner = document.getElementById('unlock-status-banner');
        if (uploadedCount === 0) {
          banner.innerHTML = `⚠️ 您目前獲批上傳 <b>0</b> 份，可查看 <b>0</b> 份。`;
        } else if (uploadedCount >= filtered.length) {
          banner.innerHTML = `🎉 您已獲批上傳 <b>${uploadedCount}</b> 份，已解鎖此分類全部考卷！`;
        } else {
          banner.innerHTML = `📊 您已獲批上傳 <b>${uploadedCount}</b> 份，可查看 <b>${uploadedCount}</b> 份。`;
        }

        renderPapers(filtered, uploadedCount);
      } catch (err) {
        listContainer.innerHTML = '<tr><td colspan="3" style="padding:20px; color:red;">載入失敗</td></tr>';
      }
    }

    function renderPapers(filteredData, allowedCount) {
      const listContainer = document.getElementById('papers-list');
      listContainer.innerHTML = '';

      if (filteredData.length === 0) {
        listContainer.innerHTML = '<tr><td colspan="3" style="padding:20px;">暫無已審核通過的考卷</td></tr>';
        return;
      }

      const visiblePapers = filteredData.slice(0, allowedCount);
      const lockedCount = Math.max(0, filteredData.length - visiblePapers.length);

      visiblePapers.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="year-tag">${escapeHtml(item.year)}</span><b>${escapeHtml(item.subject)}</b></td>
          <td>${escapeHtml(item.school)}<div class="uploader-tag">由 ${escapeHtml(item.uploader)} 上傳</div></td>
          <td><button class="download-btn" onclick="openViewer('${item.id}')">👁️ 查看</button></td>
        `;
        listContainer.appendChild(tr);
      });

      if (lockedCount > 0) {
        const lockTr = document.createElement('tr');
        lockTr.innerHTML = `
          <td colspan="3" style="padding: 14px; background: rgba(0,0,0,0.03); font-size: 13px; opacity: 0.7;">
            🔒 還有 <b>${lockedCount}</b> 份考卷被鎖定。請上傳檔案等管理員審批解鎖！
          </td>
        `;
        listContainer.appendChild(lockTr);
      }
    }

    // Admin Panel Actions
    function openAdminLogin() {
      const pass = prompt("請輸入管理員密碼:");
      if (pass === ADMIN_PASS) {
        document.getElementById('admin-modal').style.display = 'flex';
        fetchAdminPapers();
      } else if (pass !== null) {
        alert("密碼錯誤！");
      }
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    async function fetchAdminPapers() {
      const tbody = document.getElementById('admin-papers-list');
      tbody.innerHTML = '<tr><td colspan="5" style="padding:16px;">載入後台數據中...</td></tr>';

      try {
        const res = await fetch(DB_URL);
        const data = await res.json();
        adminPaperList = [];
        if (data) {
          adminPaperList = Object.keys(data).map(key => ({ id: key, ...data[key] }));
          // Also sync global papersData so admin viewer works seamlessly
          papersData = adminPaperList;
        }
        renderAdminTable();
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" style="padding:16px; color:red;">加載失敗</td></tr>';
      }
    }

    function renderAdminTable() {
      const tbody = document.getElementById('admin-papers-list');
      const filter = document.getElementById('adminStatusFilter').value;
      tbody.innerHTML = '';

      const list = adminPaperList.filter(item => {
        if (filter === 'pending') return item.approved !== true;
        if (filter === 'approved') return item.approved === true;
        return true;
      });

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="padding:16px; opacity:0.6;">無相關數據</td></tr>';
        return;
      }

      list.forEach(item => {
        const tr = document.createElement('tr');
        const isAppr = item.approved === true;
        const badge = isAppr ? '<span class="status-badge status-approved">已通過</span>' : '<span class="status-badge status-pending">待審核</span>';
        const approveBtn = !isAppr ? `<button class="btn-approve" onclick="approvePaper('${item.id}')">批准</button>` : '';

        // Added file viewing options for admin
        let viewFileAction = '';
        if (item.link) {
          if (item.link.startsWith('data:image/') || item.link.startsWith('data:application/pdf')) {
            viewFileAction = `<button class="btn-view-admin" onclick="openViewer('${item.id}')">👁️ 預覽</button>`;
          } else {
            viewFileAction = `<a href="${escapeHtml(item.link)}" target="_blank" style="color:var(--edit-btn); font-weight:bold; font-size:12px;">🔗 連結</a>`;
          }
        } else {
          viewFileAction = '<span style="font-size:11px; opacity:0.5;">無檔案</span>';
        }

        tr.innerHTML = `
          <td>${badge}</td>
          <td>[${escapeHtml(item.year)}]<br><b>${escapeHtml(item.subject)}</b></td>
          <td>${escapeHtml(item.school)}<br><small>${escapeHtml(item.uploader)}</small></td>
          <td>${viewFileAction}</td>
          <td>
            <div class="action-btns">
              ${approveBtn}
              <button class="btn-edit" onclick="editAdminPaper('${item.id}')">編輯</button>
              <button class="btn-delete" onclick="deleteAdminPaper('${item.id}')">刪除</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function editAdminPaper(id) {
      const paper = adminPaperList.find(p => p.id === id);
      if (!paper) return;

      const newSubject = prompt("修改科目名稱:", paper.subject);
      if (newSubject === null) return;
      const newYear = prompt("修改年份 (例如 2026):", paper.year);
      if (newYear === null) return;
      const newSchool = prompt("修改學校名稱:", paper.school);
      if (newSchool === null) return;
      const newUploader = prompt("修改上載者姓名:", paper.uploader);
      if (newUploader === null) return;

      try {
        await fetch(`https://uec-papers-4c1a7-default-rtdb.firebaseio.com/papers/${id}.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject: newSubject.trim(),
            year: newYear.trim(),
            school: newSchool.trim(),
            uploader: newUploader.trim()
          })
        });
        alert("資料修改成功！");
        fetchAdminPapers();
      } catch (err) {
        alert("修改失敗");
      }
    }

    async function approvePaper(id) {
      const paper = adminPaperList.find(p => p.id === id);
      if (!paper) return;

      if (!confirm(`確定批准這份試卷並為上傳者增加 1 份解鎖額度嗎？`)) return;

      try {
        await fetch(`https://uec-papers-4c1a7-default-rtdb.firebaseio.com/papers/${id}.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approved: true })
        });

        if (paper.uploaderUid) {
          const userRefUrl = `https://uec-papers-4c1a7-default-rtdb.firebaseio.com/users/${paper.uploaderUid}.json`;
          const uRes = await fetch(userRefUrl);
          const uData = await uRes.json() || { uploadedCount: 0 };
          const newCount = (uData.uploadedCount || 0) + 1;

          await fetch(userRefUrl, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uploadedCount: newCount })
          });
        }

        alert("審批成功！已同步至主站下載列表。");
        fetchAdminPapers();
      } catch (err) {
        alert("操作失敗");
      }
    }

    async function deleteAdminPaper(id) {
      if (confirm("確定從雲端永久刪除此試卷？")) {
        await fetch(`https://uec-papers-4c1a7-default-rtdb.firebaseio.com/papers/${id}.json`, { method: 'DELETE' });
        fetchAdminPapers();
      }
    }

    async function openViewer(id) {
      const paper = papersData.find(p => p.id === id) || adminPaperList.find(p => p.id === id);
      if (!paper || !paper.link) return;
      const modal = document.getElementById('viewer-modal');
      const modalBody = document.getElementById('modal-body');
      document.getElementById('modal-title').innerText = `${paper.subject} (${paper.school})`;
      modalBody.innerHTML = '<div style="color:white; padding:20px;">載入中...</div>';

      const link = paper.link;
      if (link.startsWith('data:image/')) {
        modalBody.innerHTML = `<img src="${link}">`;
      } else if (link.startsWith('data:application/pdf')) {
        modalBody.innerHTML = '';
        try {
          const pdfData = atob(link.split(',')[1]);
          const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const vp = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            canvas.className = 'pdf-page-canvas';
            canvas.height = vp.height;
            canvas.width = vp.width;
            modalBody.appendChild(canvas);
            await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
          }
        } catch(e) {
          modalBody.innerHTML = '<div style="color:red; padding:20px;">PDF 加載失敗</div>';
        }
      } else {
        window.open(link, '_blank');
        return;
      }
      modal.style.display = 'flex';
    }

    function closeViewer() { document.getElementById('viewer-modal').style.display = 'none'; }

    document.getElementById('upload-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      if (!currentUser) { openAuthView(); return; }

      const fileInput = document.getElementById('paperFile');
      const urlInput = document.getElementById('downloadUrl');
      if (!fileInput.files[0] && !urlInput.value.trim()) { alert("請上傳檔案或填寫連結"); return; }

      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = '上傳中...';

      let fileUrl = urlInput.value.trim();
      if (fileInput.files[0]) {
        fileUrl = await new Promise((res) => {
          const reader = new FileReader();
          reader.onload = () => res(reader.result);
          reader.readAsDataURL(fileInput.files[0]);
        });
      }

      const newPaper = {
        uploader: document.getElementById('uploaderName').value,
        uploaderUid: currentUser.uid,
        year: document.getElementById('paperYear').value.trim(),
        subject: document.getElementById('subjectName').value,
        school: document.getElementById('schoolName').value,
        link: fileUrl,
        approved: false,
        createdAt: Date.now()
      };

      try {
        await fetch(DB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newPaper)
        });
        submitBtn.innerText = '✓ 上傳成功';
        submitBtn.classList.add('success');
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerText = '上傳送審 (需管理員審核)';
          submitBtn.classList.remove('success');
          showMenu();
        }, 1000);
      } catch(err) {
        alert("上傳失敗");
        submitBtn.disabled = false;
        submitBtn.innerText = '上傳送審 (需管理員審核)';
      }
    });

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
