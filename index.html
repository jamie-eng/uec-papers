<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>統考預試試卷收集站</title>
  <style>
    :root {
      --bg-color: #f2f3f5;
      --card-bg: #ffffff;
      --text-color: #111111;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --header-purple: #f0ebf8;
      --header-text: #4a3b68;
      --row-even: #ffffff;
      --row-odd: #fffdf5;
      --primary-btn: #4a3b68;
      --border-color: #e2e2e2;
      --success-btn: #2e7d32;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      --header-purple: #2d243a;
      --header-text: #d8cbeb;
      --row-even: #1e1e1e;
      --row-odd: #26241e;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding-bottom: 40px; transition: background-color 0.3s, color 0.3s;
    }

    header {
      width: 100%; max-width: 480px; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background-color: var(--bg-color); z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 20px; font-weight: 700; line-height: 1.2; }

    .icon-btn {
      background: none; border: none; cursor: pointer; color: var(--text-color);
      display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 50%;
    }

    main { width: 100%; max-width: 480px; padding: 12px 20px; display: flex; flex-direction: column; gap: 20px; }

    .card {
      background-color: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow);
      padding: 36px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.2s;
    }

    .card:active { transform: scale(0.98); }
    .card-icon { width: 44px; height: 44px; margin-bottom: 14px; }
    .card-title { font-size: 19px; font-weight: 700; }

    .view-section {
      display: none; background-color: var(--card-bg); border-radius: 16px;
      padding: 20px; box-shadow: var(--shadow); margin-top: 10px;
    }

    .back-btn {
      background: none; border: none; color: var(--text-color); font-size: 14px;
      font-weight: 600; cursor: pointer; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 4px;
    }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }

    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 14px; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border-color);
      background-color: var(--card-bg); color: var(--text-color); border-radius: 8px; font-size: 14px; outline: none;
    }

    .btn-submit {
      width: 100%; background-color: var(--primary-btn); color: white; border: none;
      padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
      transition: background-color 0.2s;
    }

    .btn-submit.success { background-color: var(--success-btn); }

    .table-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
    th { background-color: var(--header-purple); color: var(--header-text); padding: 12px 6px; font-weight: 700; border-bottom: 1px solid var(--border-color); }
    td { padding: 12px 6px; vertical-align: middle; border-bottom: 1px solid var(--border-color); font-weight: 600; line-height: 1.3; }
    tr:nth-child(even) td { background-color: var(--row-even); }
    tr:nth-child(odd) td { background-color: var(--row-odd); }
    .uploader-tag { font-size: 11px; opacity: 0.7; font-weight: normal; margin-top: 4px; }
    .download-icon { color: var(--text-color); text-decoration: none; font-size: 20px; font-weight: bold; }

    svg { stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1 class="header-title">統考預試試卷<br>收集站</h1>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="theme-toggle">
        <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <main id="main-menu">
    <div class="card" id="btn-upload">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">上傳考卷</div>
    </div>
    <div class="card" id="btn-download-2025">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">下載考卷 (2025)</div>
    </div>
    <div class="card" id="btn-download-2026">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">下載考卷 (2026)</div>
    </div>
  </main>

  <main id="upload-view" class="view-section">
    <button class="back-btn" onclick="showMenu()">← 返回主頁</button>
    <div class="section-title">↑ 上傳考卷</div>
    <form id="upload-form">
      <div class="form-group"><label>上載者姓名 (Name)</label><input type="text" id="uploaderName" required placeholder="例如: 小明" /></div>
      <div class="form-group"><label>年份 (Year)</label><input type="text" id="paperYear" required value="2026" /></div>
      <div class="form-group"><label>科目 (Subject)</label><input type="text" id="subjectName" required placeholder="例如: 英文試卷 1" /></div>
      <div class="form-group"><label>學校 (School)</label><input type="text" id="schoolName" required placeholder="例如: 巴生興華中學" /></div>
      <div class="form-group"><label>考卷下載連結 (Download Link)</label><input type="url" id="downloadUrl" required placeholder="https://drive.google.com/..." /></div>
      <button type="submit" class="btn-submit" id="submit-btn">上傳並發佈</button>
    </form>
  </main>

  <main id="download-view" class="view-section">
    <button class="back-btn" onclick="showMenu()">← 返回主頁</button>
    <div class="section-title" id="download-title">↓ 下載考卷</div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>科目 <br><small>↓A-Z</small></th>
            <th>學校 <br><small>↑↓</small></th>
            <th>Download<br>Link</th>
          </tr>
        </thead>
        <tbody id="papers-list"></tbody>
      </table>
    </div>
  </main>

  <script>
    // 内存临时数组（防止某些在线编辑器禁止 localStorage 报错）
    let inMemoryPapers = [];

    document.getElementById('theme-toggle').onclick = () => document.body.classList.toggle('dark-mode');

    const mainMenu = document.getElementById('main-menu');
    const uploadView = document.getElementById('upload-view');
    const downloadView = document.getElementById('download-view');

    function showMenu() {
      mainMenu.style.display = 'flex';
      uploadView.style.display = 'none';
      downloadView.style.display = 'none';
    }

    document.getElementById('btn-upload').onclick = () => {
      mainMenu.style.display = 'none';
      uploadView.style.display = 'block';
    };

    document.getElementById('btn-download-2025').onclick = () => openDownloadPage('2025');
    document.getElementById('btn-download-2026').onclick = () => openDownloadPage('2026');

    function openDownloadPage(year) {
      mainMenu.style.display = 'none';
      downloadView.style.display = 'block';
      document.getElementById('download-title').innerText = `↓ 下載考卷 (${year})`;
      renderPapers(year);
    }

    function getStoredPapers() {
      try {
        const data = localStorage.getItem('uec_papers_data');
        return data ? JSON.parse(data) : inMemoryPapers;
      } catch (e) {
        return inMemoryPapers;
      }
    }

    function saveStoredPapers(data) {
      inMemoryPapers = data;
      try {
        localStorage.setItem('uec_papers_data', JSON.stringify(data));
      } catch (e) {
        console.warn('localStorage 不可用，已保存在内存中。');
      }
    }

    function renderPapers(year) {
      const papers = getStoredPapers().filter(p => p.year === year);
      const listContainer = document.getElementById('papers-list');
      listContainer.innerHTML = '';

      if (papers.length === 0) {
        listContainer.innerHTML = '<tr><td colspan="3" style="padding:20px;">暫無此年份的考卷數據</td></tr>';
        return;
      }

      papers.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(item.subject)}</td>
          <td>${escapeHtml(item.school)}<div class="uploader-tag">由 ${escapeHtml(item.uploader)} 上傳</div></td>
          <td><a href="${escapeHtml(item.link)}" target="_blank" class="download-icon">↓</a></td>
        `;
        listContainer.appendChild(tr);
      });
    }

    // 表单提交处理：即时完成 + 自动重置按钮（支持连续提交）
    document.getElementById('upload-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submit-btn');
      
      const newPaper = {
        id: Date.now(),
        uploader: document.getElementById('uploaderName').value,
        year: document.getElementById('paperYear').value.trim(),
        subject: document.getElementById('subjectName').value,
        school: document.getElementById('schoolName').value,
        link: document.getElementById('downloadUrl').value
      };

      // 保存数据
      const papers = getStoredPapers();
      papers.push(newPaper);
      saveStoredPapers(papers);

      // 1. 改变按钮状态为“成功”
      submitBtn.innerText = '✓ 上傳成功！';
      submitBtn.classList.add('success');
      submitBtn.disabled = true;

      // 2. 清空科目和下载链接，方便连续上传下一科
      document.getElementById('subjectName').value = '';
      document.getElementById('downloadUrl').value = '';

      // 3. 1.5秒后自动恢复按钮，可再次点击上传
      setTimeout(() => {
        submitBtn.innerText = '上傳並發佈';
        submitBtn.classList.remove('success');
        submitBtn.disabled = false;
      }, 1500);
    });

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
