<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>統考通 - UEC Pass</title>
  
  <!-- Supabase & PDF.js SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0b0e;
      --card-bg: #141418;
      --text-main: #f0f0f5;
      --text-sub: #8a8a9e;
      --border-grey: #b4b9c3;
      --accent-white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* 登录关卡样式 */
    .login-container {
      background: var(--card-bg);
      border: 2px solid var(--border-grey);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .logo {
      font-size: 42px;
      margin-bottom: 10px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; letter-spacing: 1px; }
    p { font-size: 14px; color: var(--text-sub); margin-bottom: 30px; line-height: 1.5; }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      background: var(--accent-white);
      color: #111111;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn-google:hover { background: #e6e6e6; }
    .btn-google:active { transform: scale(0.98); }

    /* 主界面 */
    .app-container {
      display: none; /* 校验通过后显示 */
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 2px solid var(--border-grey);
      border-radius: 20px;
      padding: 25px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2a35;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .user-info { font-size: 13px; color: var(--text-sub); }
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border-grey);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    /* 试卷列表 */
    .paper-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .paper-item {
      background: #1c1c24;
      border: 1px solid #333342;
      padding: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .paper-item:hover { border-color: var(--border-grey); }
    .paper-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
    .paper-sub { font-size: 12px; color: var(--text-sub); }

    /* PDF.js 预览窗口 */
    .pdf-viewer-box {
      display: none;
      margin-top: 20px;
      background: #000;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 1px solid #2a2a35;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <!-- 登录屏 -->
  <div id="login-screen" class="login-container">
    <div class="logo">📚</div>
    <h1>統考通 UEC Pass</h1>
    <p>受限访问平台<br>请使用授权的 Google 账号授权登录</p>
    
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/>
      </svg>
      使用 Google 账号登录
    </button>
  </div>

  <!-- 主界面 -->
  <div id="app-screen" class="app-container">
    <div class="header-bar">
      <div>
        <h2>統考預試試卷庫</h2>
        <div class="user-info" id="user-email-display">验证中...</div>
      </div>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </div>

    <!-- 试卷列表 -->
    <div class="paper-list">
      <div class="paper-item" onclick="loadPDF('https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/examples/learning/helloworld.pdf')">
        <div class="paper-title">📄 2025 高中高级数学 (一)</div>
        <div class="paper-sub">坤成中学预试试卷</div>
      </div>
      <div class="paper-item" onclick="alert('提示：点击第一份试卷可载入 PDF.js 在线预览')">
        <div class="paper-title">📄 2025 高中物理预试卷</div>
        <div class="paper-sub">中华中学预试试卷</div>
      </div>
    </div>

    <!-- PDF.js 预览容器 -->
    <div id="pdf-box" class="pdf-viewer-box">
      <p style="margin-bottom: 10px; font-size: 13px; color: var(--text-sub);">PDF.js 在线渲染</p>
      <canvas id="pdf-canvas"></canvas>
    </div>
  </div>

  <script>
    // 1. 设置许可进入的 Gmail 列表
    const ALLOWED_GMAILS = [
      "yangyang1913@gmail.com", 
      "student1@gmail.com"
    ];

    // 2. Supabase 凭证设置
    const SUPABASE_URL = "https://your-supabase-url.supabase.co";
    const SUPABASE_ANON_KEY = "your-supabase-anon-key";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loginWithGoogle() {
      await _supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.href }
      });
    }

    async function logout() {
      await _supabase.auth.signOut();
      window.location.reload();
    }

    async function checkAuth() {
      const { data: { user } } = await _supabase.auth.getUser();

      if (user) {
        const userEmail = user.email.toLowerCase();

        if (ALLOWED_GMAILS.includes(userEmail)) {
          document.getElementById("login-screen").style.display = "none";
          document.getElementById("app-screen").style.display = "block";
          document.getElementById("user-email-display").innerText = "已授权账号：" + userEmail;
        } else {
          alert(`抱歉，${userEmail} 未在许可名额内！`);
          await _supabase.auth.signOut();
        }
      }
    }

    // 3. PDF.js 渲染引擎
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function loadPDF(pdfUrl) {
      document.getElementById("pdf-box").style.display = "block";
      const loadingTask = pdfjsLib.getDocument(pdfUrl);
      const pdf = await loadingTask.promise;
      
      const page = await pdf.getPage(1);
      const scale = 1.5;
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.getElementById('pdf-canvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const renderContext = {
        canvasContext: context,
        viewport: viewport
      };
      await page.render(renderContext);
    }

    window.onload = checkAuth;
  </script>

</body>
</html>
