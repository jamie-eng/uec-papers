<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>統考預試試卷收集站</title>
  
  <!-- 引入 PDF.js 库，解决 iPhone/iOS 无法顺畅翻页的问题 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>

  <!-- 引入 Firebase SDK (Auth & App) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg-color: #f2f3f5;
      --card-bg: #ffffff;
      --text-color: #111111;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      --header-purple: #f0ebf8;
      --header-text: #4a3b68;
      --row-even: #ffffff;
      --row-odd: #fffdf5;
      --primary-btn: #4a3b68;
      --border-color: #e2e2e2;
      --success-btn: #2e7d32;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      --header-purple: #2d243a;
      --header-text: #d8cbeb;
      --row-even: #1e1e1e;
      --row-odd: #26241e;
      --border-color: #333333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding-bottom: 40px; transition: background-color 0.3s, color 0.3s;
    }

    header {
      width: 100%; max-width: 480px; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; background-color: var(--bg-color); z-index: 10;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-size: 20px; font-weight: 700; line-height: 1.2; }
    .header-right { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: none; border: none; cursor: pointer; color: var(--text-color);
      display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 50%;
    }

    .login-btn {
      background-color: var(--primary-btn); color: white; border: none; padding: 6px 10px;
      border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
    }

    main { width: 100%; max-width: 480px; padding: 12px 20px; display: flex; flex-direction: column; gap: 16px; }

    .card {
      background-color: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow);
      padding: 30px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.2s;
    }

    .card:active { transform: scale(0.98); }
    .card-icon { width: 40px; height: 40px; margin-bottom: 12px; }
    .card-title { font-size: 18px; font-weight: 700; text-align: center; }

    .view-section {
      display: none; background-color: var(--card-bg); border-radius: 16px;
      padding: 20px; box-shadow: var(--shadow); margin-top: 10px;
    }

    .back-btn {
      background: none; border: none; color: var(--text-color); font-size: 14px;
      font-weight: 600; cursor: pointer; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 4px;
    }

    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }

    .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 14px; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border-color);
      background-color: var(--card-bg); color: var(--text-color); border-radius: 8px; font-size: 14px; outline: none;
    }

    .file-hint { font-size: 11px; opacity: 0.6; margin-top: -2px; }

    .btn-submit {
      width: 100%; background-color: var(--primary-btn); color: white; border: none;
      padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px;
      transition: background-color 0.2s;
    }

    .btn-submit.success { background-color: var(--success-btn); }

    .table-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
    th { background-color: var(--header-purple); color: var(--header-text); padding: 12px 6px; font-weight: 700; border-bottom: 1px solid var(--border-color); }
    td { padding: 12px 6px; vertical-align: middle; border-bottom: 1px solid var(--border-color); font-weight: 600; line-height: 1.3; }
    tr:nth-child(even) td { background-color: var(--row-even); }
    tr:nth-child(odd) td { background-color: var(--row-odd); }
    
    .year-tag { font-size: 10px; background: #e0e0e0; color: #333; padding: 2px 5px; border-radius: 4px; margin-right: 4px; display: inline-block; }
    body.dark-mode .year-tag { background: #444; color: #fff; }
    
    .uploader-tag { font-size: 11px; opacity: 0.7; font-weight: normal; margin-top: 4px; }
    .download-btn { cursor: pointer; border: none; color: var(--header-text); font-size: 13px; font-weight: bold; background: var(--header-purple); padding: 6px 12px; border-radius: 6px; display: inline-block; }

    .or-divider { text-align: center; font-size: 12px; opacity: 0.5; margin: 6px 0; }
    .switch-mode-text { text-align: center; font-size: 12px; margin-top: 10px; color: var(--primary-btn); cursor: pointer; font-weight: bold; }

    /* Modal 查看器 */
    .modal {
      display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.85); flex-direction: column; align-items: center; justify-content: center; padding: 10px;
    }
    .modal-header {
      width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; color: white; padding: 10px 0;
    }
    .modal-close { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
    .modal-body {
      width: 100%; max-width: 600px; height: 80vh; background: #1a1a1a; border-radius: 12px; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center; position: relative; padding: 10px;
    }
    .modal-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .pdf-page-canvas { width: 100% !important; height: auto !important; margin-bottom: 10px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }

    svg { stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="icon-btn">
        <svg width="24" height="24" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1 class="header-title">統考預試試卷<br>收集站</h1>
    </div>
    <div class="header-right">
      <button class="login-btn" id="login-status-btn" onclick="openAuthView()">帳號登入</button>
      <button class="icon-btn" id="theme-toggle">
        <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="23" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <!-- 主菜單 -->
  <main id="main-menu">
    <div class="card" id="btn-upload">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">上傳考卷</div>
    </div>
    <div class="card" id="btn-download-2026">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">下載考卷 (2026)</div>
    </div>
    <div class="card" id="btn-download-old">
      <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg>
      <div class="card-title">下載考卷 (2025 及之前)</div>
    </div>
  </main>

  <!-- 帳號認證頁面 (登入/註冊) -->
  <main id="auth-view" class="view-section">
    <button class="back-btn" onclick="showMenu()">← 返回主頁</button>
    <div class="section-title" id="auth-title">🔐 帳號登入</div>
    <form id="auth-form">
      <div class="form-group">
        <label>電子郵件 (Gmail)</label>
        <input type="email" id="authEmail" required placeholder="example@gmail.com" />
      </div>
      <div class="form-group">
        <label>密碼 (Password)</label>
        <input type="password" id="authPassword" required placeholder="至少 6 位密碼" />
      </div>
      <button type="submit" class="btn-submit" id="auth-submit-btn">立即登入</button>
      <div class="switch-mode-text" id="switch-auth-mode" onclick="toggleAuthMode()">還沒有帳號？點此免費註冊</div>
    </form>
  </main>

  <!-- 上傳頁面 -->
  <main id="upload-view" class="view-section">
    <button class="back-btn" onclick="showMenu()">← 返回主頁</button>
    <div class="section-title">↑ 上傳考卷</div>
    <form id="upload-form">
      <div class="form-group">
        <label>上載者姓名 (Name)</label>
        <input type="text" id="uploaderName" required placeholder="例如: 小明" />
      </div>
      <div class="form-group">
        <label>年份 (Year)</label>
        <input type="number" id="paperYear" required value="2026" placeholder="例如: 2026, 2025..." />
      </div>
      <div class="form-group">
        <label>科目 (Subject)</label>
        <input type="text" id="subjectName" required placeholder="例如: 華文試卷 1" />
      </div>
      <div class="form-group">
        <label>學校 (School)</label>
        <input type="text" id="schoolName" required placeholder="例如: 巴生興華中學" />
      </div>
      
      <div class="form-group">
        <label>📁 選擇本地檔案 (PDF / 圖片)</label>
        <input type="file" id="paperFile" accept=".pdf,image/*" />
        <span class="file-hint">⚠️ 本地文件大小上限：<b>100MB</b></span>
      </div>

      <div class="or-divider">── 或填寫網絡連結 ──</div>

      <div class="form-group">
        <label>考卷下載連結 (Google Drive / 云端)</label>
        <input type="url" id="downloadUrl" placeholder="https://drive.google.com/..." />
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">上傳同步到 Firebase 雲端</button>
    </form>
  </main>

  <!-- 下載列表頁面 -->
  <main id="download-view" class="view-section">
    <button class="back-btn" onclick="showMenu()">← 返回主頁</button>
    <div class="section-title" id="download-title">↓ 下載考卷</div>
    <div style="font-size: 12px; opacity: 0.8; text-align: center; margin-bottom: 12px;" id="unlock-status-banner"></div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>年份/科目</th>
            <th>學校</th>
            <th>檢視/下載</th>
          </tr>
        </thead>
        <tbody id="papers-list"></tbody>
      </table>
    </div>
  </main>

  <!-- 全屏查看器 Modal -->
  <div id="viewer-modal" class="modal">
    <div class="modal-header">
      <span id="modal-title">考卷預覽</span>
      <button class="modal-close" onclick="closeViewer()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBBIEc7IPrUCUdBsspZR4dZgjCXcFB2IFE",
      authDomain: "uec-papers.firebaseapp.com",
      databaseURL: "https://uec-papers-default-rtdb.firebaseio.com",
      projectId: "uec-papers",
      storageBucket: "uec-papers.firebasestorage.app",
      messagingSenderId: "525376968385",
      appId: "1:525376968385:web:77fe8b723e7ca878986640",
      measurementId: "G-BD2P5DYWWC"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const DB_URL = "https://uec-papers-default-rtdb.firebaseio.com/papers.json";
    const MAX_FILE_SIZE_MB = 100;
    let currentCategory = '2026';
    let papersData = [];
    let currentUser = null;
    let isRegisterMode = false;

    // 監聽 Firebase 登入狀態
    firebase.auth().onAuthStateChanged((user) => {
      currentUser = user;
      const loginBtn = document.getElementById('login-status-btn');
      if (user) {
        loginBtn.innerText = "已登入 (登出)";
        loginBtn.style.background = "#2e7d32";
      } else {
        loginBtn.innerText = "帳號登入";
        loginBtn.style.background = "var(--primary-btn)";
      }
    });

    // 切換登入與註冊介面
    function openAuthView() {
      if (currentUser) {
        if (confirm(`目前已登入：${currentUser.email}\n確定要登出帳號嗎？`)) {
          firebase.auth().signOut().then(() => {
            showMenu();
          });
        }
        return;
      }
      mainMenu.style.display = 'none';
      uploadView.style.display = 'none';
      downloadView.style.display = 'none';
      document.getElementById('auth-view').style.display = 'block';
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('auth-title');
      const submitBtn = document.getElementById('auth-submit-btn');
      const switchText = document.getElementById('switch-auth-mode');

      if (isRegisterMode) {
        title.innerText = "📝 免費帳號註冊";
        submitBtn.innerText = "確認註冊";
        switchText.innerText = "已有帳號？點此直接登入";
      } else {
        title.innerText = "🔐 帳號登入";
        submitBtn.innerText = "立即登入";
        switchText.innerText = "還沒有帳號？點此免費註冊";
      }
    }

    // 處理帳號登入 / 註冊表單送出
    document.getElementById('auth-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const submitBtn = document.getElementById('auth-submit-btn');

      submitBtn.disabled = true;
      submitBtn.innerText = '處理中...';

      try {
        if (isRegisterMode) {
          await firebase.auth().createUserWithEmailAndPassword(email, password);
          alert("註冊成功並已自動登入！");
        } else {
          await firebase.auth().signInWithEmailAndPassword(email, password);
          alert("登入成功！");
        }
        document.getElementById('authEmail').value = '';
        document.getElementById('authPassword').value = '';
        showMenu();
      } catch (err) {
        alert("操作失敗: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = isRegisterMode ? "確認註冊" : "立即登入";
      }
    });

    document.getElementById('theme-toggle').onclick = () => document.body.classList.toggle('dark-mode');
    const mainMenu = document.getElementById('main-menu');
    const uploadView = document.getElementById('upload-view');
    const downloadView = document.getElementById('download-view');

    function showMenu() {
      mainMenu.style.display = 'flex';
      uploadView.style.display = 'none';
      downloadView.style.display = 'none';
      document.getElementById('auth-view').style.display = 'none';
    }

    document.getElementById('btn-upload').onclick = () => {
      if (!currentUser) {
        alert("請先登入帳號才能上傳考卷！");
        openAuthView();
        return;
      }
      mainMenu.style.display = 'none';
      uploadView.style.display = 'block';
    };

    document.getElementById('btn-download-2026').onclick = () => openDownloadPage('2026');
    document.getElementById('btn-download-old').onclick = () => openDownloadPage('old');

    async function openDownloadPage(category) {
      if (!currentUser) {
        if (confirm("您需要先登入帳號才能查看或下載考卷。是否前往登入？")) {
          openAuthView();
        }
        return;
      }

      mainMenu.style.display = 'none';
      downloadView.style.display = 'block';
      currentCategory = category;
      document.getElementById('download-title').innerText = category === '2026' ? '↓ 下載考卷 (2026)' : '↓ 下載考卷 (2025 及之前)';
      await fetchPapers();
    }

    async function fetchPapers() {
      const listContainer = document.getElementById('papers-list');
      listContainer.innerHTML = '<tr><td colspan="3" style="padding:20px;">資料載入中...</td></tr>';

      try {
        const response = await fetch(DB_URL, { method: 'GET', headers: { 'Accept': 'application/json' } });
        const data = await response.json();
        
        papersData = [];
        if (data) {
          papersData = Object.keys(data).map(key => ({
            id: key,
            ...data[key]
          }));
        }

        const userRefUrl = `https://uec-papers-default-rtdb.firebaseio.com/users/${currentUser.uid}.json`;
        const userRes = await fetch(userRefUrl);
        const userData = await userRes.json() || { uploadedCount: 0 };
        const uploadedCount = userData.uploadedCount || 0;

        const filtered = papersData.filter(p => {
          const y = parseInt(p.year);
          return category === '2026' ? y === 2026 : (y <= 2025 || isNaN(y));
        });

        const allowedVisibleCount = uploadedCount * 2;
        const banner = document.getElementById('unlock-status-banner');
        
        if (uploadedCount === 0) {
          banner.innerHTML = `⚠️ 您目前累計上傳 <b>0</b> 份檔案，可查看 <b>0</b> 份。請至少上傳 1 份解鎖查看權限！`;
        } else if (allowedVisibleCount >= filtered.length) {
          banner.innerHTML = `🎉 您已上傳 <b>${uploadedCount}</b> 份檔案（解鎖額度：${allowedVisibleCount} 份），目前已解鎖此分類的<b>全部考卷</b>！`;
        } else {
          banner.innerHTML = `📊 您已上傳 <b>${uploadedCount}</b> 份檔案，解鎖可查看 <b>${allowedVisibleCount}</b> 份（總計 ${filtered.length} 份）。多上傳可解鎖更多！`;
        }

        renderPapers(filtered, allowedVisibleCount);
      } catch (err) {
        listContainer.innerHTML = '<tr><td colspan="3" style="padding:20px; color:red;">載入失敗，請檢查網絡。</td></tr>';
      }
    }

    function renderPapers(filteredData, allowedCount) {
      const listContainer = document.getElementById('papers-list');
      listContainer.innerHTML = '';

      if (filteredData.length === 0) {
        listContainer.innerHTML = '<tr><td colspan="3" style="padding:20px;">暫無此分類的考卷數據</td></tr>';
        return;
      }

      const visiblePapers = filteredData.slice(0, allowedCount);
      const lockedCount = Math.max(0, filteredData.length - visiblePapers.length);

      visiblePapers.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="year-tag">${escapeHtml(item.year)}</span><b>${escapeHtml(item.subject)}</b></td>
          <td>${escapeHtml(item.school)}<div class="uploader-tag">由 ${escapeHtml(item.uploader)} 上傳</div></td>
          <td><button class="download-btn" onclick="openViewer('${item.id}')">👁️ 查看 / 下載</button></td>
        `;
        listContainer.appendChild(tr);
      });

      if (lockedCount > 0) {
        const lockTr = document.createElement('tr');
        lockTr.innerHTML = `
          <td colspan="3" style="padding: 16px; background: rgba(0,0,0,0.03); font-size: 13px; opacity: 0.7;">
            🔒 還有 <b>${lockedCount}</b> 份考卷被鎖定。請上傳更多檔案以解鎖雙倍查看權限！
            <br><button style="margin-top:6px; padding:4px 10px; background:var(--primary-btn); color:white; border:none; border-radius:4px; cursor:pointer;" onclick="document.getElementById('btn-upload').click()">去上傳檔案</button>
          </td>
        `;
        listContainer.appendChild(lockTr);
      }
    }

    async function openViewer(id) {
      const paper = papersData.find(p => p.id === id);
      if (!paper || !paper.link) {
        alert("找不到檔案連結！");
        return;
      }

      const modal = document.getElementById('viewer-modal');
      const modalBody = document.getElementById('modal-body');
      const modalTitle = document.getElementById('modal-title');
      
      modalTitle.innerText = `${paper.subject} (${paper.school})`;
      modalBody.innerHTML = '<div style="color:white; padding:20px;">正在加載檔案页面...</div>';

      const link = paper.link;

      if (link.startsWith('data:image/')) {
        modalBody.innerHTML = '';
        const img = document.createElement('img');
        img.src = link;
        modalBody.appendChild(img);
      } else if (link.startsWith('data:application/pdf')) {
        modalBody.innerHTML = '';
        
        const topBar = document.createElement('div');
        topBar.style.cssText = 'padding:8px; width:100%; text-align:center; background:#2a2a2a; border-radius:6px; margin-bottom:10px;';
        
        const openBtn = document.createElement('button');
        openBtn.innerText = '💾 在新標籤頁開啟 / 儲存完整 PDF';
        openBtn.style.cssText = 'padding:6px 14px; background:#4a3b68; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;';
        openBtn.onclick = () => {
          const blob = base64ToBlob(link);
          const blobUrl = URL.createObjectURL(blob);
          window.open(blobUrl, '_blank');
        };
        topBar.appendChild(openBtn);
        modalBody.appendChild(topBar);

        try {
          const pdfData = atob(link.split(',')[1]);
          const loadingTask = pdfjsLib.getDocument({ data: pdfData });
          const pdf = await loadingTask.promise;

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });
            
            const canvas = document.createElement('canvas');
            canvas.className = 'pdf-page-canvas';
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            modalBody.appendChild(canvas);

            await page.render({
              canvasContext: context,
              viewport: viewport
            }).promise;
          }
        } catch (err) {
          modalBody.innerHTML = '<div style="color:red; padding:20px;">PDF 加載失敗，請嘗試在新標籤頁開啟。</div>';
          modalBody.appendChild(topBar);
        }
      } else {
        window.open(link, '_blank');
        return;
      }

      modal.style.display = 'flex';
    }

    function base64ToBlob(base64Data) {
      const parts = base64Data.split(';base64,');
      const contentType = parts[0].split(':')[1];
      const raw = window.atob(parts[1]);
      const uInt8Array = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; ++i) {
        uInt8Array[i] = raw.charCodeAt(i);
      }
      return new Blob([uInt8Array], { type: contentType });
    }

    function closeViewer() {
      document.getElementById('viewer-modal').style.display = 'none';
      document.getElementById('modal-body').innerHTML = '';
    }

    document.getElementById('paperFile').addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const fileSizeMB = file.size / (1024 * 1024);
        if (fileSizeMB > MAX_FILE_SIZE_MB) {
          alert(`⚠️ 檔案過大！\n你選擇的檔案大小為 ${fileSizeMB.toFixed(1)}MB，已超過上限 ${MAX_FILE_SIZE_MB}MB。\n請壓縮檔案或使用 Google Drive 連結上傳！`);
          this.value = '';
        }
      }
    });

    document.getElementById('upload-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!currentUser) {
        alert("請先完成登入才能上傳考卷！");
        openAuthView();
        return;
      }

      const submitBtn = document.getElementById('submit-btn');
      const fileInput = document.getElementById('paperFile');
      const urlInput = document.getElementById('downloadUrl');

      if (!fileInput.files[0] && !urlInput.value.trim()) {
        alert("請選擇本地檔案，或者填寫下載連結！");
        return;
      }

      const file = fileInput.files[0];
      if (file && (file.size / (1024 * 1024)) > MAX_FILE_SIZE_MB) {
        alert(`檔案超過 ${MAX_FILE_SIZE_MB}MB 限制，無法上傳！`);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = '正在上傳並更新解鎖額度...';

      let fileUrl = urlInput.value.trim();
      if (fileInput.files[0]) {
        fileUrl = await readFileAsBase64(fileInput.files[0]);
      }

      const newPaper = {
        uploader: document.getElementById('uploaderName').value,
        year: document.getElementById('paperYear').value.trim(),
        subject: document.getElementById('subjectName').value,
        school: document.getElementById('schoolName').value,
        link: fileUrl,
        createdAt: Date.now()
      };

      try {
        const resPaper = await fetch(DB_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newPaper)
        });

        if (!resPaper.ok) throw new Error('Paper upload failed');

        const userRefUrl = `https://uec-papers-default-rtdb.firebaseio.com/users/${currentUser.uid}.json`;
        const userRes = await fetch(userRefUrl);
        const userData = await userRes.json() || { uploadedCount: 0 };

        const newCount = (userData.uploadedCount || 0) + 1;
        const todayStr = new Date().toISOString().split('T')[0];
        const oneDayMs = 24 * 60 * 60 * 1000;
        
        const currentApprovedUntil = userData.approvedUntil && userData.approvedUntil > Date.now() ? userData.approvedUntil : Date.now();
        const newApprovedUntil = currentApprovedUntil + oneDayMs;

        await fetch(userRefUrl, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: currentUser.email,
            uploadedCount: newCount,
            approvedUntil: newApprovedUntil,
            lastUploadDate: todayStr
          })
        });

        submitBtn.innerText = '✓ 上傳成功！額度已加倍';
        submitBtn.classList.add('success');

        document.getElementById('subjectName').value = '';
        urlInput.value = '';
        fileInput.value = '';

        setTimeout(() => {
          submitBtn.innerText = '上傳同步到 Firebase 雲端';
          submitBtn.classList.remove('success');
          submitBtn.disabled = false;
          alert(`上傳成功！您目前累計上傳 ${newCount} 份，已解鎖查看 ${newCount * 2} 份檔案的權限！`);
          showMenu();
        }, 1000);

      } catch (err) {
        alert('上傳失敗！請檢查網絡連線後重試。');
        submitBtn.innerText = '上傳同步到 Firebase 雲端';
        submitBtn.disabled = false;
      }
    });

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
